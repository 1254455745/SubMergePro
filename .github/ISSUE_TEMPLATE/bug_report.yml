name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: SubMergePro version
      placeholder: "1.0.0"
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
  - type: input
    id: ffmpeg-version
    attributes:
      label: FFmpeg version
      placeholder: "ffmpeg -version"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Drag screenshots or paste relevant error text here.
